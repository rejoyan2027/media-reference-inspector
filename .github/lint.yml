name: Lint and targeted tests
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
      - name: PHP syntax
        run: find . -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Targeted smoke tests
        run: php tests/smoke-test.php && php tests/scanner-smoke.php && php tests/dashboard-smoke.php && php tests/delete-smoke.php && php tests/delete-smoke.php --trash
      - name: JavaScript syntax
        run: node --check assets/js/admin.js && node --check assets/js/site-audit.js && node --check assets/js/dashboard.js && node --check assets/js/media-cleanup.js
